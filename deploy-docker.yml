---

- name: Deploy Java Application Docker Container

  hosts: appserver # This matches the group in your inventory file

  become: yes      # This tells Ansible to run commands with sudo
 
  tasks:

    - name: Update apt package cache

      apt:

        update_cache: yes
 
    - name: Install pip for Python 3

      apt:

        name: python3-pip

        state: present
 
    - name: Install Docker SDK for Python

      pip:

        name: docker

        state: present
 
    - name: Pull the latest Docker image from Docker Hub

      docker_image:

        name: "sugaanks/java-app:latest"

        source: pull

        state: present
 
    # --- THIS TASK HAS BEEN REMOVED ---

    # - name: Stop and remove any existing container of the same name

    #   docker_container:

    #     name: "java-app"

    #     state: absent
 
    - name: Run the Docker container

      docker_container:

        name: "java-app"

        image: "sugaanks/java-app:latest"

        state: started

        recreate: yes  # <-- THIS IS THE CRUCIAL LINE TO ADD

        restart_policy: always

        ports:

          - "8080:8080"

 
